server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Never let API/WebSocket requests fall through to the SPA document. New
    # bundles use the explicit restaurant-service origin; these compatibility
    # routes keep older relative-URL bundles working during rollout.
    location ^~ /ws/ {
        proxy_pass https://restaurant-prod.mangaale.com;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host restaurant-prod.mangaale.com;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_ssl_server_name on;
        proxy_ssl_name restaurant-prod.mangaale.com;
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
        proxy_buffering off;
        proxy_cache off;
        access_log off;
    }

    location ^~ /kds/ {
        proxy_pass https://restaurant-prod.mangaale.com;
        proxy_set_header Host restaurant-prod.mangaale.com;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_ssl_server_name on;
        proxy_ssl_name restaurant-prod.mangaale.com;
        proxy_read_timeout 30s;
        proxy_buffering off;
        proxy_cache off;
        access_log off;
    }

    location ^~ /counters/ {
        proxy_pass https://restaurant-prod.mangaale.com;
        proxy_set_header Host restaurant-prod.mangaale.com;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_ssl_server_name on;
        proxy_read_timeout 30s;
        proxy_buffering off;
        proxy_cache off;
        access_log off;
    }

    # Compatibility for older bundles that also baked an empty user-service
    # origin and posted login credentials to the frontend host.
    location ^~ /users/ {
        proxy_pass https://user-prod.mangaale.com;
        proxy_set_header Host user-prod.mangaale.com;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_ssl_server_name on;
        proxy_ssl_name user-prod.mangaale.com;
        proxy_read_timeout 30s;
        proxy_buffering off;
        proxy_cache off;
        access_log off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }
}
